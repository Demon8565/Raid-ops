<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Smugolot Raid Ops</title>

<style>
  :root{
    --bg: #0C1A19;
    --surface: #122624;
    --surface-2: #17302D;
    --teal: #4BE0C4;
    --teal-dim: #2E7C6D;
    --magenta: #FF3FA6;
    --ink: #EAFBF6;
    --ink-dim: #8FB6AE;
    --line: rgba(75,224,196,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(600px 300px at 85% -5%, rgba(255,63,166,0.10), transparent 60%),
      radial-gradient(800px 400px at -10% 0%, rgba(75,224,196,0.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{ font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }

  header{
    padding:28px 20px 18px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--magenta);
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-size:28px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  h1 span{ color:var(--teal); }
  .sub{
    color:var(--ink-dim);
    font-size:13px;
    margin-top:6px;
  }

  .wrap{ max-width:520px; margin:0 auto; padding:0 16px; }

  /* Leaderboard rail */
  .rail{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:14px 2px 6px;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{ display:none; }
  .rail-card{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    min-width:92px;
    text-align:center;
  }
  .rail-rank{ font-size:10px; color:var(--ink-dim); }
  .rail-name{ font-size:13px; font-weight:700; margin:2px 0; }
  .rail-pts{ font-size:15px; color:var(--teal); font-weight:800; }

  section{ margin-top:22px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .section-title{ font-size:14px; font-weight:700; color:var(--ink); }
  .section-title .count{ color:var(--ink-dim); font-weight:500; }

  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn{
    background:var(--teal);
    color:#04211C;
    font-weight:700;
    font-size:13px;
    padding:9px 14px;
    border-radius:10px;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn.ghost{
    background:transparent;
    color:var(--teal);
    border:1px solid var(--teal-dim);
  }
  .btn.small{ padding:6px 10px; font-size:12px; }

  /* Raid cards */
  .raid{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .raid-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .platform{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--magenta);
  }
  .platform::before{ content:"●"; font-size:8px; }
  .pts-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; font-weight:700;
    background:var(--surface-2);
    color:var(--teal);
    border-radius:8px; padding:4px 8px;
    white-space:nowrap;
  }
  .raid-instructions{
    font-size:13.5px; color:var(--ink); line-height:1.45; margin:8px 0 10px;
  }
  .raid-link{
    display:block;
    font-size:12.5px;
    color:var(--teal);
    text-decoration:none;
    word-break:break-all;
    margin-bottom:12px;
    border-bottom:1px dashed var(--teal-dim);
    padding-bottom:2px;
  }
  .checkins{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .chip{
    font-size:12.5px;
    padding:7px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink-dim);
    font-weight:600;
  }
  .chip.done{
    background:rgba(75,224,196,0.14);
    border-color:var(--teal);
    color:var(--teal);
  }
  .chip.done::after{ content:" ✓"; }

  .empty{
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
    padding:30px 10px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }

  /* New raid form */
  .fab{
    position:fixed; right:18px; bottom:18px;
    width:54px; height:54px; border-radius:50%;
    background:var(--magenta);
    color:#1A0512;
    font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(255,63,166,0.35);
    z-index:20;
  }
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(3,10,9,0.7);
    backdrop-filter: blur(2px);
    display:none; z-index:30;
    align-items:flex-end;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:20px 18px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{ font-size:16px; margin:0 0 14px; }
  .field{ margin-bottom:12px; }
  .field label{
    display:block; font-size:11.5px; color:var(--ink-dim);
    margin-bottom:5px; text-transform:uppercase; letter-spacing:0.05em;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:9px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:16px; }
  .sheet-actions .btn{ flex:1; text-align:center; }
  .close-x{
    position:absolute; top:16px; right:18px;
    color:var(--ink-dim); font-size:20px; background:none;
  }
  .members-manage{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;
  }
  .member-tag{
    font-size:12px; background:var(--surface-2); border:1px solid var(--line);
    padding:5px 10px; border-radius:14px; display:flex; align-items:center; gap:6px;
  }
  .member-tag button{ background:none; color:var(--ink-dim); font-size:13px; }
  .status{ text-align:center; font-size:11px; color:var(--ink-dim); margin-top:26px; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">$SMG Crew</div>
  <h1>Raid <span>Ops</span></h1>
  <div class="sub">Post a target. The crew checks in. Points hit the board.</div>
</header>

<div class="wrap">
  <div class="rail" id="leaderboard"></div>

  <section>
    <div class="section-head">
      <div class="section-title">Active raids <span class="count" id="activeCount"></span></div>
      <button class="btn ghost small" id="manageMembersBtn">Crew</button>
    </div>
    <div id="activeList"></div>
  </section>

  <section id="archiveSection" style="display:none;">
    <div class="section-head">
      <div class="section-title">Archive</div>
    </div>
    <div id="archiveList"></div>
  </section>

  <div class="status" id="connStatus">connecting…</div>
</div>

<button class="fab" id="newRaidFab">+</button>

<!-- New raid sheet -->
<div class="sheet-backdrop" id="raidSheetBackdrop">
  <div class="sheet">
    <button class="close-x" data-close>×</button>
    <h2>New raid target</h2>
    <div class="field">
      <label>Platform</label>
      <select id="f-platform">
        <option value="X">X</option>
        <option value="Telegram">Telegram</option>
        <option value="Discord">Discord</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Link to raid</label>
      <input id="f-url" type="url" placeholder="https://x.com/...">
    </div>
    <div class="field">
      <label>Instructions</label>
      <textarea id="f-instructions" placeholder="Like, reply with a bullish take, and quote-post. Keep it human, no copy-paste spam."></textarea>
    </div>
    <div class="field">
      <label>Smug Points on completion</label>
      <input id="f-points" type="number" value="10" min="1" step="1">
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn" id="submitRaid">Post raid</button>
    </div>
  </div>
</div>

<!-- Manage crew sheet -->
<div class="sheet-backdrop" id="crewSheetBackdrop">
  <div class="sheet">
    <button class="close-x" data-close>×</button>
    <h2>Manage crew</h2>
    <div class="field">
      <label>Add member</label>
      <input id="f-member" type="text" placeholder="Name or handle">
    </div>
    <button class="btn small" id="addMemberBtn">Add to crew</button>
    <div class="members-manage" id="memberTags"></div>
    <div class="sheet-actions">
      <button class="btn ghost" data-close style="flex:1;">Done</button>
    </div>
  </div>
</div>

<script>
/* ====================== DATABASE (plain REST) ======================
   No Firebase app registration needed — just the Realtime Database
   REST endpoint. Same project as the Smugolot Crush leaderboard.
   Data lives under its own raidOps/ node so it never collides with
   the leaderboard data already in this project.

   IMPORTANT: this only works if your Database Rules allow public
   read/write (or at least on the raidOps/ path). Check in Firebase
   Console → Realtime Database → Rules. If you see something like
   { "rules": { ".read": false, ".write": false } } you'll need to
   open it up, e.g.:
   { "rules": { "raidOps": { ".read": true, ".write": true } } }
   ===================================================================== */
const DB_URL = "https://smugolot-leaderboard-default-rtdb.firebaseio.com";

let members = {};   // { memberId: name }
let raids   = {};   // { raidId: {platform,url,instructions,points,createdAt,active,checkins:{memberId:true}} }

const statusEl = document.getElementById('connStatus');

async function dbGet(path){
  const res = await fetch(`${DB_URL}/${path}.json`);
  if (!res.ok) throw new Error(`GET ${path} failed (${res.status})`);
  return res.json();
}
async function dbPut(path, value){
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(value)
  });
  if (!res.ok) throw new Error(`PUT ${path} failed (${res.status})`);
  return res.json();
}
async function dbPost(path, value){
  const res = await fetch(`${DB_URL}/${path}.json`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(value)
  });
  if (!res.ok) throw new Error(`POST ${path} failed (${res.status})`);
  return res.json(); // { name: "-generatedKey" }
}
async function dbDelete(path){
  const res = await fetch(`${DB_URL}/${path}.json`, { method: 'DELETE' });
  if (!res.ok) throw new Error(`DELETE ${path} failed (${res.status})`);
  return res.json();
}

async function syncAll(){
  try{
    const [m, r] = await Promise.all([dbGet('raidOps/members'), dbGet('raidOps/raids')]);
    members = m || {};
    raids = r || {};
    statusEl.textContent = 'live · synced with the crew';
    render();
  }catch(err){
    console.error(err);
    statusEl.textContent = 'offline · reconnecting…';
  }
}

syncAll();
setInterval(syncAll, 4000); // poll every 4s so everyone's device stays in sync

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function pointsFor(memberId){
  let total = 0;
  Object.values(raids).forEach(r => {
    if (r.checkins && r.checkins[memberId]) total += Number(r.points) || 0;
  });
  return total;
}

function render(){
  renderLeaderboard();
  renderRaids();
  renderMemberTags();
}

function renderLeaderboard(){
  const rail = document.getElementById('leaderboard');
  const ids = Object.keys(members);
  if (!ids.length){
    rail.innerHTML = '<div class="empty" style="width:100%;">No crew yet. Tap "Crew" to add your 5.</div>';
    return;
  }
  const ranked = ids.map(id => ({id, name: members[id], pts: pointsFor(id)}))
                     .sort((a,b) => b.pts - a.pts);
  rail.innerHTML = ranked.map((m,i) => `
    <div class="rail-card">
      <div class="rail-rank">#${i+1}</div>
      <div class="rail-name">${escapeHtml(m.name)}</div>
      <div class="rail-pts mono">${m.pts}</div>
    </div>
  `).join('');
}

function renderRaids(){
  const memberIds = Object.keys(members);
  const entries = Object.entries(raids).sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));
  const active = entries.filter(([,r]) => r.active !== false);
  const archived = entries.filter(([,r]) => r.active === false);

  document.getElementById('activeCount').textContent = active.length ? `(${active.length})` : '';

  const activeList = document.getElementById('activeList');
  if (!active.length){
    activeList.innerHTML = `<div class="empty">No active raids. Tap + to post a target for the crew.</div>`;
  } else {
    activeList.innerHTML = active.map(([id, r]) => raidCard(id, r, memberIds, true)).join('');
  }

  const archiveSection = document.getElementById('archiveSection');
  const archiveList = document.getElementById('archiveList');
  if (archived.length){
    archiveSection.style.display = '';
    archiveList.innerHTML = archived.map(([id, r]) => raidCard(id, r, memberIds, false)).join('');
  } else {
    archiveSection.style.display = 'none';
  }
}

function raidCard(id, r, memberIds, isActive){
  const checkins = r.checkins || {};
  const doneCount = memberIds.filter(m => checkins[m]).length;
  const chips = memberIds.map(mid => `
    <button class="chip ${checkins[mid] ? 'done' : ''}" data-raid="${id}" data-member="${mid}" ${isActive ? '' : 'disabled'}>
      ${escapeHtml(members[mid])}
    </button>
  `).join('');
  const archiveBtn = isActive
    ? `<button class="btn ghost small" data-archive="${id}">Archive</button>`
    : `<span class="pts-badge">${doneCount}/${memberIds.length} done</span>`;

  return `
    <div class="raid">
      <div class="raid-top">
        <span class="platform">${escapeHtml(r.platform || 'X')}</span>
        <span class="pts-badge">+${r.points} pts</span>
      </div>
      ${r.instructions ? `<div class="raid-instructions">${escapeHtml(r.instructions)}</div>` : ''}
      ${r.url ? `<a class="raid-link" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>` : ''}
      <div class="checkins">${chips || '<span class="empty" style="padding:10px;">Add crew members first</span>'}</div>
      <div style="display:flex; justify-content:flex-end; margin-top:12px;">${archiveBtn}</div>
    </div>
  `;
}

function renderMemberTags(){
  const wrap = document.getElementById('memberTags');
  const ids = Object.keys(members);
  wrap.innerHTML = ids.length ? ids.map(id => `
    <span class="member-tag">${escapeHtml(members[id])}<button data-remove-member="${id}">×</button></span>
  `).join('') : '<span class="empty" style="width:100%;">No crew added yet.</span>';
}

// ---- interactions ----
document.body.addEventListener('click', async e => {
  const chip = e.target.closest('.chip[data-raid]');
  if (chip){
    const raidId = chip.dataset.raid;
    const memberId = chip.dataset.member;
    const currentlyDone = !!(raids[raidId] && raids[raidId].checkins && raids[raidId].checkins[memberId]);
    // optimistic local update so the tap feels instant
    raids[raidId] = raids[raidId] || {};
    raids[raidId].checkins = raids[raidId].checkins || {};
    if (currentlyDone) delete raids[raidId].checkins[memberId];
    else raids[raidId].checkins[memberId] = true;
    render();
    try{
      if (currentlyDone) await dbDelete(`raidOps/raids/${raidId}/checkins/${memberId}`);
      else await dbPut(`raidOps/raids/${raidId}/checkins/${memberId}`, true);
    }catch(err){ console.error(err); syncAll(); }
    return;
  }
  const archiveBtn = e.target.closest('[data-archive]');
  if (archiveBtn){
    const id = archiveBtn.dataset.archive;
    if (raids[id]) raids[id].active = false;
    render();
    try{ await dbPut(`raidOps/raids/${id}/active`, false); }
    catch(err){ console.error(err); syncAll(); }
    return;
  }
  const removeBtn = e.target.closest('[data-remove-member]');
  if (removeBtn){
    if (confirm('Remove this member? Their points history stays on past raids.')){
      const id = removeBtn.dataset.removeMember;
      delete members[id];
      render();
      try{ await dbDelete(`raidOps/members/${id}`); }
      catch(err){ console.error(err); syncAll(); }
    }
    return;
  }
});

document.getElementById('newRaidFab').onclick = () => {
  document.getElementById('raidSheetBackdrop').classList.add('open');
};
document.getElementById('manageMembersBtn').onclick = () => {
  document.getElementById('crewSheetBackdrop').classList.add('open');
};
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.onclick = () => {
    document.getElementById('raidSheetBackdrop').classList.remove('open');
    document.getElementById('crewSheetBackdrop').classList.remove('open');
  };
});

document.getElementById('submitRaid').onclick = async () => {
  const platform = document.getElementById('f-platform').value;
  const url = document.getElementById('f-url').value.trim();
  const instructions = document.getElementById('f-instructions').value.trim();
  const points = parseInt(document.getElementById('f-points').value, 10) || 10;
  if (!url && !instructions){
    alert('Add a link or instructions for the crew.');
    return;
  }
  const raid = { platform, url, instructions, points, active: true, createdAt: Date.now(), checkins: {} };
  document.getElementById('f-url').value = '';
  document.getElementById('f-instructions').value = '';
  document.getElementById('f-points').value = 10;
  document.getElementById('raidSheetBackdrop').classList.remove('open');
  try{
    const res = await dbPost('raidOps/raids', raid);
    raids[res.name] = raid;
    render();
  }catch(err){ console.error(err); alert('Could not post raid — check your connection.'); }
};

document.getElementById('addMemberBtn').onclick = async () => {
  const input = document.getElementById('f-member');
  const name = input.value.trim();
  if (!name) return;
  input.value = '';
  try{
    const res = await dbPost('raidOps/members', name);
    members[res.name] = name;
    render();
  }catch(err){ console.error(err); alert('Could not add member — check your connection.'); }
};
</script>
</body>
</html>
